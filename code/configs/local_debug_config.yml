# Here is for CIFAR10:
model:
    image_size: 32
    out_channels: 3
    base_width: 4
    n_T: 5
    use_aug_label: False
    dropout: 0.15
    net_type: ncsnppedm
    average_loss: True # use average or sum for loss
    sampler: ddpm
    sample_clip_denoised: True
    # sampler: heun
    # sampler: edm
    # sampler: edm-sde
    ode_solver: jax
    # ode_solver: scipy # rk45
    no_condition_t: False
    class_conditional: False
    t_condition_method: direct # default: log999
    target: x # default: eps

    # experiments
    exp: predict # option: disturb, predict, joint
    # disturb: 0.02
dataset:
    name: cifar10
    root: CIFAR # pytorch
    prefetch_factor: 2
    num_workers: 64 # NOTE: On V2, if you don't use num_workers=64, sometimes the code will exit unexpectedly
    cache: True
aug: 
    use_edm_aug: False # TODO: enable this and test
fid:
    on_use: False 
    eval_only: False
    fid_per_epoch: 1
    num_samples: 1000
    cache_ref: /kmh-nfs-us-mount/data/cached/cifar10_jax_stats_20240820.npz # pytorch
evalu:
    ema: True
    sample: True
ema_type: edm # [edm, const]
batch_size: 512
num_epochs: 10
learning_rate: 0.0008
lr_schedule: const
weight_decay: 0.0
optimizer: adamw
adam_b2: 0.95
warmup_epochs: 200
log_per_step: 10
visualize_per_epoch: 1
eval_per_epoch: 1
wandb: False
checkpoint_per_epoch: 100
save_by_fid: True
# load_from: /kmh-nfs-us-mount/logs/sqa/sqa_Flow_matching/20241127_010129_q9ifcu_kmh-tpuvm-v2-32-6__b_lr_ep_eval/checkpoint_194000
# diffusion_nT: 4000 # ADM
diffusion_nT: 500 # DDPM
diffusion_schedule: cosine
time_weighting: const

