# Here is for IMAGENET32x32:
model:
    image_size: 32
    out_channels: 3
    base_width: 256
    n_T: 100
    head: 4
    use_aug_label: False
    dropout: 0 # FM
    net_type: zhhshenyi
    average_loss: True # use average or sum for loss

    # sampler: euler
    # sampler: heun
    # sampler: edm
    # sampler: edm-sde
    # sampler: DDIM
    ode_solver: O # rk45
    
    no_condition_t: False
dataset:
    name: imagenet
    root: /kmh-nfs-us-mount/data/imagenet
    prefetch_factor: 2
    num_workers: 64 # NOTE: On V2, if you don't use num_workers=64, sometimes the code will exit unexpectedly
    cache: True
    image_size: 32 # imagenet resized to 32x32
aug: 
    use_edm_aug: False
fid:
    # on_use: False
    eval_only: False
    fid_per_epoch: 25
    num_samples: 50000
    cache_ref: /kmh-nfs-ssd-eu-mount/data/cached/zhh/imagenet32_train_jax_stats_20241228.npz # pytorch
evalu:
    ema: True
    sample: False
# wandb: False

# ema
ema_schedule: edm # ['edm', 'const']
# ema_value: 0.9999 # only useful for 'const'
ema_halflife_kimg: 100000 # only useful for 'edm'
ema_rampup_ratio: 0.135 # only useful for 'edm'

batch_size: 2048
num_epochs: 225
learning_rate: 0.0002
lr_schedule: sqa # options: ['const', 'poly', 'consine', 'sqa']
middle_epochs: 200 # only for sqa
weight_decay: 0.0
optimizer: adamw
adam_b2: 0.95
grad_clip: 0.0
warmup_steps: 40000 # for poly schedule
# warmup_epochs: 2 # for const schedule
log_per_step: 100
visualize_per_epoch: 10
eval_per_epoch: 20
checkpoint_per_epoch: 50
# load_from: /kmh-nfs-us-mount/logs/sqa/sqa_Flow_matching/20241229_005044_bctmck_kmh-tpuvm-v2-32-7__b_lr_ep_eval/checkpoint_125000